name: Chromium sandbox smoke test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/chromium-smoke.yml']
  workflow_dispatch:
permissions: {}
jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify kernel restrictions on live Chromium renderers
        shell: bash
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          import http.server
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile
          import threading
          import time

          rendered = threading.Event()
          page = b'''<!doctype html><title>Synthetic fixture</title>
          <p id="marker"></p><script>
          document.querySelector('#marker').textContent = 'synthetic-render-ok';
          fetch('/rendered', {method: 'POST'});
          </script>'''

          class Handler(http.server.BaseHTTPRequestHandler):
              def log_message(self, *_):
                  pass

              def do_GET(self):
                  if self.path != '/':
                      self.send_error(404)
                      return
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/html; charset=utf-8')
                  self.send_header('Content-Length', str(len(page)))
                  self.end_headers()
                  self.wfile.write(page)

              def do_POST(self):
                  if self.path != '/rendered':
                      self.send_error(404)
                      return
                  self.send_response(204)
                  self.end_headers()
                  rendered.set()

          def status(pid):
              return dict(line.split(':', 1) for line in Path(f'/proc/{pid}/status').read_text().splitlines())

          def metrics(fields):
              return (int(fields['Seccomp']), int(fields['Seccomp_filters']),
                      int(fields['NoNewPrivs']), len(fields['NSpid'].split()),
                      int(fields['CapEff'], 16))

          def protected(renderer, browser):
              mode, filters, no_new_privs, pid_depth, caps = renderer
              return (mode == 2 and filters > browser[1] and no_new_privs == 1
                      and pid_depth > browser[3] and caps == 0)

          def renderer_metrics(profile, expected_browser):
              # Chrome creates this file only in this disposable profile.
              port, path = (Path(profile) / 'DevToolsActivePort').read_text().splitlines()
              if not port.isdecimal() or not path.startswith('/devtools/browser/'):
                  raise SystemExit('FAIL: unexpected local DevTools address')
              ws = f'ws://127.0.0.1:{port}{path}'
              data = subprocess.run(['node', '--experimental-websocket', '-e', "const socket = new WebSocket(process.argv[1]);\nconst timer = setTimeout(() => process.exit(2), 2500);\nsocket.addEventListener('open', () => socket.send(JSON.stringify({id: 1, method: 'SystemInfo.getProcessInfo'})));\nsocket.addEventListener('error', () => process.exit(3));\nsocket.addEventListener('message', event => {\n  const msg = JSON.parse(event.data);\n  if (msg.id !== 1) return;\n  if (!Array.isArray(msg.result?.processInfo)) process.exit(4);\n  clearTimeout(timer);\n  console.log(JSON.stringify(msg.result.processInfo.map(({type,id}) => ({type,id}))));\n  socket.close();\n});", ws],
                                    check=True, capture_output=True, timeout=4, text=True)
              info = json.loads(data.stdout)
              if not any(x['type'].lower() == 'browser' and x['id'] == expected_browser for x in info):
                  raise SystemExit('FAIL: Chromium did not identify the expected browser process')
              ids = [x['id'] for x in info if x['type'].lower() == 'renderer']
              if not all(isinstance(pid, int) and pid > 0 and pid != expected_browser for pid in ids):
                  raise SystemExit('FAIL: invalid renderer process identifier')
              return [metrics(status(pid)) for pid in ids]

          if os.geteuid() == 0:
              raise SystemExit('FAIL: this test requires an unprivileged account')
          chrome = shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          if not chrome:
              raise SystemExit('FAIL: Google Chrome is not installed')
          subprocess.run([chrome, '--version'], check=True)
          with http.server.ThreadingHTTPServer(('127.0.0.1', 0), Handler) as server:
              threading.Thread(target=server.serve_forever, daemon=True).start()
              with tempfile.TemporaryDirectory() as profile, tempfile.TemporaryFile() as diagnostics:
                  cmd = [chrome, '--headless', '--no-first-run', '--no-default-browser-check',
                         '--disable-background-networking', '--remote-debugging-address=127.0.0.1',
                         '--remote-debugging-port=0', f'--user-data-dir={profile}',
                         f'http://127.0.0.1:{server.server_port}/']
                  with subprocess.Popen(cmd, stdout=diagnostics, stderr=diagnostics) as browser:
                      try:
                          if not rendered.wait(25) or browser.poll() is not None:
                              raise SystemExit('FAIL: no JavaScript acknowledgement from fixture')
                          print('PASS: loopback page executed JavaScript in the measured browser', flush=True)
                          baseline = metrics(status(browser.pid))
                          deadline = time.monotonic() + 8
                          while True:
                              try:
                                  samples = renderer_metrics(profile, browser.pid)
                              except FileNotFoundError:
                                  samples = []
                              if samples and all(protected(s, baseline) for s in samples):
                                  break
                              if time.monotonic() >= deadline or browser.poll() is not None:
                                  print(f'Browser baseline: {baseline}; renderer samples: {samples}', flush=True)
                                  raise SystemExit('FAIL: required renderer isolation was not verified')
                              time.sleep(0.2)
                          print(f'Browser baseline: {baseline}', flush=True)
                          print('Source of renderer PIDs: Chromium SystemInfo, cross-checked against /proc')
                          print('Renderer fields: Seccomp, filters, NoNewPrivs, PID namespace depth, effective capabilities')
                          print(f'Renderer samples: {samples}')
                          print('PASS: renderer seccomp, PID isolation and privilege restrictions verified')
                      finally:
                          if browser.poll() is None:
                              browser.terminate()
                              try:
                                  browser.wait(timeout=5)
                              except subprocess.TimeoutExpired:
                                  browser.kill()
                                  browser.wait()
                          server.shutdown()
          PY
